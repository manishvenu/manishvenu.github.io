# Rebuilds and publishes the site every time you push to main.
# Python/notebook output is taken from _freeze/, so nothing is executed here.
name: Publish site
on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
