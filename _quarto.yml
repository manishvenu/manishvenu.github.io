# _quarto.yml: the ONE settings file for the whole site.
# Quarto reads this first, then turns every .qmd file into an HTML page in _site/.

project:
  type: website          # "website" = build a multi-page site with a navbar
  output-dir: _site      # where the finished HTML goes (don't edit or commit it)
  render:                # only .qmd files become pages (so README.md etc. are left alone)
    - "*.qmd"
    - "*/**/*.qmd"
  resources:
    - CNAME              # copy the custom-domain file into the build as-is

website:
  title: "Manish Venumuddula"                 # shown at the top-left of every page
  site-url: https://manish.venumuddula.com
  favicon: images/favicon.png                 # the little browser-tab icon
  navbar:
    left:                                     # one entry per navbar link
      - href: index.qmd
        text: Home
      - href: projects/index.qmd
        text: Projects
      - href: games/index.qmd
        text: Games
      - href: blog/index.qmd
        text: Blog
    right:                                    # icons come from https://icons.getbootstrap.com
      - icon: github
        href: https://github.com/manishvenu
      - icon: linkedin
        href: https://www.linkedin.com/in/manish-venumuddula

format:
  html:
    theme: cosmo         # try: flatly, litera, lumen, sandstone, yeti (https://bootswatch.com)
